[project]
name = "turbozero"
version = "0.1.1"
description = "vectorized alphazero/mcts in JAX"
authors = [{ name = "jcbmrshll", email = "92640744+jcbmrshll@users.noreply.github.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "equinox>=0.13.8",
    "jax>=0.11.2",
    "optax>=0.2.8",
]

[project.scripts]
turbozero-monitor = "monitor.server:main"

[project.optional-dependencies]
# GPU build of jax; ./install.sh adds this when it finds an NVIDIA GPU
cuda = ["jax[cuda13]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "monitor"]

[tool.pyright]
include = ["core", "monitor", "tests", "examples"]
venvPath = "."
venv = ".venv"
# the Othello example's scripts import their sibling modules, and so do its tests
executionEnvironments = [
    { root = "examples/othello", extraPaths = ["examples/othello"] },
    { root = "tests", extraPaths = ["examples/othello"] },
]

[tool.ruff]
# `ruff check` uses ruff's default rule set (no select/ignore); `ruff format` uses its defaults (line length 88)

[dependency-groups]
dev = [
    # environments + pretrained baselines used by the examples (pgx's baseline models need haiku)
    "dm-haiku>=0.0.17",
    "pgx>=2.6.0",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# summarise xfails/xpasses/skips at the end of the run; skip tests marked slow (run them
# with `pytest -m slow`)
addopts = "-ra -m 'not slow'"
markers = ["slow: takes several seconds (deselected by default; run with -m slow)"]
xfail_strict = true
